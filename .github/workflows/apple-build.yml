name: Apple build

on:
  workflow_call:
    inputs:
      source-repository:
        description: Optional explicit source repository; explicit provenance is Ergon-only except the Playarr Simulator test dispatcher
        required: false
        default: ""
        type: string
      source-ref:
        description: Optional full immutable source commit SHA; defaults to the caller commit
        required: false
        default: ""
        type: string
      invocation-id:
        description: Optional UUID for strict Ergon wrapper correlation
        required: false
        default: ""
        type: string
      task:
        description: Apple task to run
        required: false
        default: toolchain
        type: string
      capture-id:
        description: Non-secret Core capture identifier for bounded iOS log capture
        required: false
        default: ""
        type: string
      lease-id:
        description: Non-secret Core simulator lease identifier
        required: false
        default: ""
        type: string
      runtime-id:
        description: Non-secret Core simulator runtime identifier
        required: false
        default: ""
        type: string
      working-directory:
        description: Repository-relative working directory
        required: false
        default: .
        type: string
      project:
        description: Repository-relative Xcode project path
        required: false
        default: ""
        type: string
      workspace:
        description: Repository-relative Xcode workspace path
        required: false
        default: ""
        type: string
      scheme:
        description: Xcode scheme for build or test
        required: false
        default: ""
        type: string
      configuration:
        description: Xcode build configuration
        required: false
        default: Debug
        type: string
      destination:
        description: macos or an executable platform-qualified xcodebuild destination
        required: false
        default: macos
        type: string
    secrets:
      playarr_readonly_deploy_key:
        description: Read-only key for the private Playarr source, used only by its test dispatcher
        required: false

permissions:
  contents: read

concurrency:
  group: apple-builder-${{ github.repository }}-${{ inputs.invocation-id || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  apple:
    if: ${{ github.event.repository.private == true && inputs.task != 'ios-log-capture' && inputs.task != 'ios-interactive-session' }}
    name: Apple build ${{ inputs.invocation-id || format('{0}-{1}', github.run_id, github.run_attempt) }}
    runs-on:
      group: apple-builders
      labels: apple-builder
    timeout-minutes: 60
    env:
      APPLE_TASK: ${{ inputs.task }}
      APPLE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      APPLE_PROJECT: ${{ inputs.project }}
      APPLE_WORKSPACE: ${{ inputs.workspace }}
      APPLE_SCHEME: ${{ inputs.scheme }}
      APPLE_CONFIGURATION: ${{ inputs.configuration }}
      APPLE_DESTINATION: ${{ inputs.destination }}
      APPLE_SOURCE_REPOSITORY: ${{ inputs.source-repository || github.repository }}
      APPLE_SOURCE_REPOSITORY_INPUT: ${{ inputs.source-repository }}
      APPLE_SOURCE_REF: ${{ inputs.source-ref || github.sha }}
      APPLE_SOURCE_REF_INPUT: ${{ inputs.source-ref }}
      GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      HAS_PLAYARR_READONLY_DEPLOY_KEY: ${{ secrets.playarr_readonly_deploy_key != '' }}
      APPLE_INVOCATION_ID: ${{ inputs.invocation-id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      APPLE_INVOCATION_ID_INPUT: ${{ inputs.invocation-id }}
    steps:
      - name: Validate immutable source and invocation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY_PRIVATE" == true ]]
          if [[ "$GITHUB_REPOSITORY" == "DynacomSolutions/playarr-apple-builds" ]]; then
            [[ "$APPLE_TASK" == xcode-test ]]
            [[ "$APPLE_SOURCE_REPOSITORY_INPUT" == "ThomasMcFarlane/playarr" ]]
            [[ "$APPLE_SOURCE_REPOSITORY" == "ThomasMcFarlane/playarr" ]]
            [[ -n "$APPLE_SOURCE_REF_INPUT" && -z "$APPLE_INVOCATION_ID_INPUT" ]]
            [[ "$APPLE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
            [[ "$HAS_PLAYARR_READONLY_DEPLOY_KEY" == true ]]
          else
            [[ "$HAS_PLAYARR_READONLY_DEPLOY_KEY" == false ]]
            [[ "$APPLE_SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
            if [[ -n "$APPLE_SOURCE_REPOSITORY_INPUT" || -n "$APPLE_SOURCE_REF_INPUT" || -n "$APPLE_INVOCATION_ID_INPUT" ]]; then
              [[ -n "$APPLE_SOURCE_REPOSITORY_INPUT" && -n "$APPLE_SOURCE_REF_INPUT" && -n "$APPLE_INVOCATION_ID_INPUT" ]]
              [[ "$GITHUB_REPOSITORY" == "DynacomSolutions/ergon" ]]
              [[ "$APPLE_SOURCE_REPOSITORY" == "DynacomSolutions/ergon" ]]
              [[ "$APPLE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
              [[ "$APPLE_INVOCATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
            else
              [[ "$APPLE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
            fi
          fi
          case "$APPLE_TASK" in toolchain|swift-test|xcode-build|xcode-test|xcode-archive) ;; *) exit 2 ;; esac
          [[ "$APPLE_WORKING_DIRECTORY" != /* ]]
          [[ "$APPLE_PROJECT" != /* && "$APPLE_WORKSPACE" != /* ]]
      - name: Check out immutable caller source commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APPLE_SOURCE_REPOSITORY }}
          ref: ${{ env.APPLE_SOURCE_REF }}
          ssh-key: ${{ github.repository == 'DynacomSolutions/playarr-apple-builds' && inputs.task == 'xcode-test' && secrets.playarr_readonly_deploy_key || '' }}
          clean: true
          persist-credentials: false

      - name: Validate checkout-relative working paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          paths = {
              'working_directory': os.environ['APPLE_WORKING_DIRECTORY'],
              'project': os.environ['APPLE_PROJECT'],
              'workspace': os.environ['APPLE_WORKSPACE'],
          }
          if paths['project'] and paths['workspace']:
              raise SystemExit('project and workspace are mutually exclusive')
          for label, value in paths.items():
              if not value:
                  continue
              candidate = pathlib.Path(value)
              if candidate.is_absolute() or '..' in candidate.parts:
                  raise SystemExit(f'{label} must be checkout-relative')
              resolved = (root / candidate).resolve(strict=True)
              try:
                  resolved.relative_to(root)
              except ValueError:
                  raise SystemExit(f'{label} resolves outside the checkout')
              if not resolved.is_dir():
                  raise SystemExit(f'{label} must resolve to a directory')
          PY

      - name: Record checked-out source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$APPLE_SOURCE_REF" ]]
          printf 'actual_head_sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"

      - name: Capture bounded Apple toolchain inventory
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"
          swift --version > "$RUNNER_TEMP/swift-version.txt"
          xcodebuild -showsdks > "$RUNNER_TEMP/xcode-sdks.txt"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/simulator-runtimes.json"
          test "$(wc -c < "$RUNNER_TEMP/simulator-runtimes.json")" -le 1048576
          python3 - <<'PY'
          import json, os, pathlib, platform, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          xcode = (root / 'xcode-version.txt').read_text().splitlines()
          swift = (root / 'swift-version.txt').read_text().splitlines()
          sdk_text = (root / 'xcode-sdks.txt').read_text().splitlines()
          runtime_data = json.loads((root / 'simulator-runtimes.json').read_text())
          version = next((line.removeprefix('Xcode ') for line in xcode if line.startswith('Xcode ')), '')
          build = next((line.removeprefix('Build version ') for line in xcode if line.startswith('Build version ')), '')
          sdks = []
          for line in sdk_text:
              match = re.match(r'^\s*(iOS|iOS Simulator|macOS|tvOS|tvOS Simulator|watchOS|watchOS Simulator|visionOS|visionOS Simulator)\s+([0-9.]+)(?:\s+-sdk\s+\S+)?\s*$', line)
              if match:
                  sdks.append({'platform': match.group(1), 'version': match.group(2), 'available': True})
          runtimes = []
          for item in runtime_data.get('runtimes', []):
              runtimes.append({'identifier': item.get('identifier', ''), 'version': item.get('version', ''), 'isAvailable': bool(item.get('isAvailable')), 'devices': item.get('devices', [])})
          inventory = {
              'schemaVersion': 1,
              'executor': {'runnerGroup': 'apple-builders', 'runnerLabel': 'apple-builder', 'runnerOs': platform.system(), 'runnerArch': platform.machine()},
              'xcode': {'version': version, 'build': build},
              'swift': {'version': next((line for line in swift if line.startswith('Apple Swift version ')), swift[0] if swift else '')},
              'sdks': sdks,
              'simulatorRuntimes': runtimes,
          }
          (root / 'apple-toolchain-inventory.json').write_text(json.dumps(inventory, separators=(',', ':')) + '\n')
          manifest = {
              'schemaVersion': 1,
              'sourceRepository': os.environ['APPLE_SOURCE_REPOSITORY'],
              'requestedSourceSha': os.environ['APPLE_SOURCE_REF'],
              'actualHeadSha': os.popen('git rev-parse HEAD').read().strip(),
              'invocationId': os.environ['APPLE_INVOCATION_ID'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'workflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          (root / 'apple-run-manifest.json').write_text(json.dumps(manifest, separators=(',', ':')) + '\n')
          PY
          test -s "$RUNNER_TEMP/apple-toolchain-inventory.json"
          test "$(wc -c < "$RUNNER_TEMP/apple-toolchain-inventory.json")" -le 1048576
          test "$(wc -c < "$RUNNER_TEMP/apple-run-manifest.json")" -le 1048576
          test -s "$RUNNER_TEMP/apple-run-manifest.json"

      - name: Run declared Apple task
        id: apple_task
        shell: bash
        run: |
          set -euo pipefail
          workdir="$GITHUB_WORKSPACE/$APPLE_WORKING_DIRECTORY"
          test -d "$workdir"
          cd "$workdir"
          destination_lower="$(printf '%s' "$APPLE_DESTINATION" | tr '[:upper:]' '[:lower:]')"
          platform=macos
          execution_destination=
          case "$APPLE_TASK" in
            toolchain|swift-test)
              [[ "$destination_lower" == macos ]] || { echo "$APPLE_TASK runs on the macOS host and does not accept a cross-target marker" >&2; exit 2; }
              ;;
            xcode-build|xcode-test|xcode-archive)
              case "$destination_lower" in
                generic/platform=ios\ simulator)
                  [[ "$APPLE_TASK" == xcode-archive ]] || exit 2
                  platform=ios-simulator
                  execution_destination='generic/platform=iOS Simulator'
                  ;;
                macos)
                  execution_destination='platform=macOS'
                  ;;
                platform=macos)
                  execution_destination="$APPLE_DESTINATION"
                  ;;
                platform=macos,arch=*|platform=macos,variant=*)
                  [[ "$destination_lower" =~ ^platform=macos,(arch|variant)=[^,]+$ ]] || exit 2
                  execution_destination="$APPLE_DESTINATION"
                  ;;
                platform=ios\ simulator,name=*|platform=ios\ simulator,id=*)
                  [[ "$destination_lower" =~ ^platform=ios[[:space:]]simulator,(name|id)=[^,]+(,os=[^,]+)?$ ]] || exit 2
                  platform=ios-simulator
                  execution_destination="$APPLE_DESTINATION"
                  ;;
                platform=tvos\ simulator,name=*|platform=tvos\ simulator,id=*)
                  [[ "$destination_lower" =~ ^platform=tvos[[:space:]]simulator,(name|id)=[^,]+(,os=[^,]+)?$ ]] || exit 2
                  platform=tvos-simulator
                  execution_destination="$APPLE_DESTINATION"
                  ;;
                *) echo 'Xcode tasks require macos or a concrete macOS, iOS Simulator or tvOS Simulator platform destination' >&2; exit 2 ;;
              esac
              if [[ "$APPLE_TASK" == xcode-archive && "$execution_destination" != 'generic/platform=iOS Simulator' ]]; then
                echo 'Archive task requires generic/platform=iOS Simulator' >&2
                exit 2
              fi
              ;;
            *) echo 'Unsupported Apple task' >&2; exit 2 ;;
          esac
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          log="$RUNNER_TEMP/apple-log-$platform.txt"
          case "$APPLE_TASK" in
            toolchain)
              { sw_vers; uname -m; xcodebuild -version; swift --version; xcodebuild -showsdks; xcrun simctl list runtimes --json; } > "$log" 2>&1
              ;;
            swift-test)
              swift test 2>&1 | tee "$log"
              ;;
            xcode-build|xcode-test|xcode-archive)
              test -n "$APPLE_SCHEME"
              test -z "$APPLE_PROJECT" || test -z "$APPLE_WORKSPACE"
              args=(-scheme "$APPLE_SCHEME" -configuration "$APPLE_CONFIGURATION")
              if [[ "$APPLE_TASK" == xcode-archive ]]; then
                [[ "$platform" == ios-simulator ]] || { echo 'Archive task requires iOS Simulator' >&2; exit 2; }
                args+=(-archivePath "$RUNNER_TEMP/apple-$platform.xcarchive" CODE_SIGNING_ALLOWED=NO SKIP_INSTALL=NO)
              else
                args+=(-resultBundlePath "$RUNNER_TEMP/apple-$platform.xcresult")
              fi
              if test -n "$APPLE_PROJECT"; then args+=(-project "$GITHUB_WORKSPACE/$APPLE_PROJECT"); fi
              if test -n "$APPLE_WORKSPACE"; then args+=(-workspace "$GITHUB_WORKSPACE/$APPLE_WORKSPACE"); fi
              args+=(-destination "$execution_destination")
              action=build
              test "$APPLE_TASK" = xcode-test && action=test
              test "$APPLE_TASK" = xcode-archive && action=archive
              xcodebuild "$action" "${args[@]}" 2>&1 | tee "$log"
              ;;
          esac

      - name: Admit bounded retained evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          log_count=0
          for log in "$RUNNER_TEMP"/apple-log-*.txt; do
            bounded="${log%.txt}.bounded.txt"
            if tail -c 10485760 "$log" > "$bounded"; then
              ((log_count += 1))
            else
              rm -f "$bounded"
            fi
          done
          echo "log_admitted=$([[ $log_count -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          admitted=true
          result_count=0
          for result in "$RUNNER_TEMP"/apple-*.xcresult; do
            if [[ -L "$result" || ! -d "$result" || ! -f "$result/Info.plist" ]]; then
              admitted=false
              continue
            fi
            ((result_count += 1))
            result_bytes="$(python3 - "$result" <<'PY'
          import os, sys
          total = 0
          for root, directories, files in os.walk(sys.argv[1], followlinks=False):
              for name in directories + files:
                  if os.path.islink(os.path.join(root, name)):
                      print("symlink")
                      sys.exit(0)
              for name in files:
                  path = os.path.join(root, name)
                  total += os.path.getsize(path)
          print(total)
          PY
          )"
            if [[ ! "$result_bytes" =~ ^[0-9]+$ ]] || (( result_bytes > 104857600 )); then
              admitted=false
            fi
          done
          [[ $result_count -gt 0 ]] || admitted=false
          echo "xcresult_admitted=$admitted" >> "$GITHUB_OUTPUT"
          archive="$RUNNER_TEMP/apple-ios-simulator.xcarchive"
          archive_admitted=false
          if [[ "$APPLE_TASK" == xcode-archive ]]; then
            if python3 - "$archive" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          total = 0
          admitted = False
          try:
              if stat.S_ISDIR(archive.lstat().st_mode):
                  if stat.S_ISREG((archive / "Info.plist").lstat().st_mode):
                      pending = [archive]
                      admitted = True
                      while pending and admitted:
                          directory = pending.pop()
                          with os.scandir(directory) as entries:
                              for entry in entries:
                                  entry_stat = entry.stat(follow_symlinks=False)
                                  if stat.S_ISDIR(entry_stat.st_mode):
                                      pending.append(Path(entry.path))
                                  elif stat.S_ISREG(entry_stat.st_mode):
                                      total += entry_stat.st_size
                                      if total > 268435456:
                                          admitted = False
                                          break
                                  else:
                                      admitted = False
                                      break
          except (OSError, ValueError):
              admitted = False

          if not admitted:
              print("archive rejected: missing, unsafe, unreadable, or over the size limit", file=sys.stderr)
              raise SystemExit(1)
          PY
            then
              archive_admitted=true
            fi
          fi
          echo "xcarchive_admitted=$archive_admitted" >> "$GITHUB_OUTPUT"
          if [[ "$APPLE_TASK" == xcode-archive && "$archive_admitted" != true ]]; then
            echo 'Xcode archive failed bounded archive admission' >&2
            exit 1
          fi

      - name: Upload Apple log
        if: always() && steps.evidence.outputs.log_admitted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apple-log-${{ steps.apple_task.outputs.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-log-*.bounded.txt
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Upload toolchain inventory and run manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-toolchain-inventory-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apple-toolchain-inventory.json
            ${{ runner.temp }}/apple-run-manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Upload Xcode result bundle
        if: always() && steps.evidence.outputs.xcresult_admitted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apple-xcresult-${{ steps.apple_task.outputs.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Upload bounded iOS Simulator archive
        if: steps.evidence.outputs.xcarchive_admitted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apple-xcarchive-ios-simulator-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-ios-simulator.xcarchive
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  ios_log_capture:
    if: ${{ github.event.repository.private == true && inputs.task == 'ios-log-capture' }}
    name: iOS log capture ${{ inputs.capture-id }}
    runs-on:
      group: apple-builders
      labels: apple-builder
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MOBILE_IOS_CAPTURE_ID: ${{ inputs.capture-id }}
      MOBILE_IOS_LEASE_ID: ${{ inputs.lease-id }}
      MOBILE_IOS_RUNTIME_ID: ${{ inputs.runtime-id }}
      MOBILE_IOS_BRIDGE_URL: ${{ vars.MOBILE_IOS_BRIDGE_URL }}
      MOBILE_IOS_OIDC_AUDIENCE: ${{ vars.MOBILE_IOS_OIDC_AUDIENCE }}
      APPLE_SOURCE_REPOSITORY: ${{ inputs.source-repository || github.repository }}
      APPLE_SOURCE_REF: ${{ inputs.source-ref || github.sha }}
    steps:
      - name: Validate private capture inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == DynacomSolutions/ergon && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$MOBILE_IOS_CAPTURE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ -n "$MOBILE_IOS_LEASE_ID" && -n "$MOBILE_IOS_RUNTIME_ID" ]]
          [[ "$APPLE_SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" && "$APPLE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$MOBILE_IOS_BRIDGE_URL" && -n "$MOBILE_IOS_OIDC_AUDIENCE" ]]
      - name: Check out immutable caller source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APPLE_SOURCE_REPOSITORY }}
          ref: ${{ env.APPLE_SOURCE_REF }}
          clean: true
          persist-credentials: false
      - name: Capture selected simulator app logs
        shell: bash
        run: node .github/scripts/mobile-ios-log-capture.mjs

  ios_interactive_session:
    if: ${{ github.repository == 'DynacomSolutions/ergon' && github.event.repository.private == true && inputs.task == 'ios-interactive-session' }}
    name: iOS interactive session ${{ inputs.lease-id }}
    runs-on:
      group: apple-builders
      labels: apple-builder
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MOBILE_IOS_LEASE_ID: ${{ inputs.lease-id }}
      MOBILE_IOS_RUNTIME_ID: ${{ inputs.runtime-id }}
      MOBILE_IOS_BRIDGE_ORIGIN: ${{ vars.MOBILE_IOS_BRIDGE_URL }}
      MOBILE_IOS_OIDC_AUDIENCE: ${{ vars.MOBILE_IOS_OIDC_AUDIENCE }}
      APPLE_SOURCE_REPOSITORY: ${{ inputs.source-repository || github.repository }}
      APPLE_SOURCE_REF: ${{ inputs.source-ref || github.sha }}
    steps:
      - name: Validate private interactive session inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == DynacomSolutions/ergon && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$MOBILE_IOS_LEASE_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$MOBILE_IOS_RUNTIME_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]]
          [[ "$APPLE_SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" && "$APPLE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$MOBILE_IOS_BRIDGE_ORIGIN" && -n "$MOBILE_IOS_OIDC_AUDIENCE" ]]
      - name: Check out immutable caller source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APPLE_SOURCE_REPOSITORY }}
          ref: ${{ env.APPLE_SOURCE_REF }}
          clean: true
          persist-credentials: false
      - name: Verify interactive helper and Simulator input prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPLE_SOURCE_REF" ]]
          test -f apps/core/src/orchestration/mobile-ios-synthetic-app.swift
          test -f .github/scripts/mobile-ios-interactive.mjs
          command -v xcrun
          command -v idb
      - name: Run lease-bound interactive Simulator worker
        shell: bash
        run: node .github/scripts/mobile-ios-interactive.mjs

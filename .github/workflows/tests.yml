name: Workflow tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-tests:
    name: Workflow tests
    # Public repository: GitHub-hosted runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node
        timeout-minutes: 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install pinned PyYAML
        timeout-minutes: 3
        run: |
          printf '%s\n' 'PyYAML==6.0.2 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476' > "$RUNNER_TEMP/requirements.txt"
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/requirements.txt"

      - name: No-hosted-runners scanner tests
        timeout-minutes: 3
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit("Python 3.12 is required") if sys.version_info[:2] != (3, 12) else None'
          python3 .github/workflows/no-hosted-runners.test.py

      - name: Apple build contract tests
        timeout-minutes: 3
        run: node --test .github/workflows/apple-build.contract.test.mjs

name: No GitHub-hosted runners

# Org-wide guard, meant to be attached as a required workflow (organization
# ruleset "workflows" rule) for private repositories. It fails when any
# runs-on in the target repository selects a GitHub-hosted runner.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  no-hosted-runners:
    name: No GitHub-hosted runners
    if: github.event.repository.private
    # Dedicated always-warm self-hosted runner pool. GitHub has no job priority, so
    # on a busy shared pool this required check could queue behind builds and time out.
    runs-on: k3s-guard
    timeout-minutes: 10
    steps:
      - name: Checkout target repository
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Provision pinned YAML parser
        timeout-minutes: 3
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit("Python 3.12 is required") if sys.version_info[:2] != (3, 12) else None'
          timeout 120s python3 - <<'PY'
          import hashlib
          import io
          import os
          import shutil
          import tarfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          url = "https://files.pythonhosted.org/packages/54/ed/79a089b6be93607fa5cdaedf301d7dfb23af5f25c398d5ead2525b063e17/pyyaml-6.0.2.tar.gz"
          expected = "d584d9ec91ad65861cc08d42e834324ef890a082e591037abe114850ff7bbc3e"
          with urllib.request.urlopen(url, timeout=10) as response:
              archive_bytes = response.read(1024 * 1024 + 1)
          if len(archive_bytes) > 1024 * 1024:
              raise SystemExit("PyYAML source archive exceeded the 1 MiB limit")
          if hashlib.sha256(archive_bytes).hexdigest() != expected:
              raise SystemExit("PyYAML 6.0.2 source archive checksum mismatch")

          target = Path(os.environ["RUNNER_TEMP"]) / "no-hosted-runners-pyyaml-6.0.2"
          target.mkdir(parents=True, exist_ok=True)
          prefix = "pyyaml-6.0.2/lib/yaml/"
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:gz") as archive:
              for member in archive.getmembers():
                  if not member.name.startswith(prefix):
                      continue
                  relative = PurePosixPath(member.name[len(prefix):])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit("Unsafe path in verified PyYAML archive")
                  destination = target / "yaml" / Path(*relative.parts)
                  if member.isdir():
                      destination.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      source = archive.extractfile(member)
                      if source is None:
                          raise SystemExit(f"Cannot read PyYAML archive member: {member.name}")
                      with source, destination.open("wb") as output:
                          shutil.copyfileobj(source, output)
          if not (target / "yaml" / "__init__.py").is_file():
              raise SystemExit("PyYAML 6.0.2 package files were not extracted")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PYTHONPATH={target}{os.pathsep}{os.environ.get('PYTHONPATH', '')}\n")
          PY
          PYTHONPATH="$RUNNER_TEMP/no-hosted-runners-pyyaml-6.0.2${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -c 'import yaml; assert yaml.__version__ == "6.0.2"'
          echo "PyYAML 6.0.2 ready"

      - name: Scan runs-on
        timeout-minutes: 3
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, re, sys

          # GitHub-hosted labels: ubuntu-*, macos-*, windows-* (incl. -latest, -arm, -xlarge).
          HOSTED = re.compile(r"(?<![\w.-])(ubuntu|macos|windows)-[\w.-]+", re.I)
          offenders = []  # (file, line, label)

          # A ternary expression (condition, then 'label-a', then 'label-b'): the condition only picks between two
          # literal labels, so it is accepted when both literals pass the hosted-label check
          # (the HOSTED scan below covers the whole expression text, including the literals).
          TERNARY_SHAPE = re.compile(r"\$\{\{(?P<cond>[^{}]*?)&&\s*'[\w.-]+'\s*\|\|\s*'[\w.-]+'\s*\}\}")
          UNTRUSTED_REF = re.compile(r"\b(inputs|vars|env|matrix|secrets)\.|github\.event\.inputs")

          class _Ternary:
              @staticmethod
              def fullmatch(expression):
                  m = TERNARY_SHAPE.fullmatch(expression)
                  if not m:
                      return None
                  if UNTRUSTED_REF.search(expression):
                      return None
                  # Drop quoted strings, then balanced parenthesised groups; a `||` left at the
                  # top level of the condition would make the result fall through to an
                  # arbitrary right-hand value (a || b && 'x' || 'y' is a || (b && 'x') || 'y').
                  cond = re.sub(r"'(?:[^']|'')*'", "''", m.group("cond"))
                  previous = None
                  while previous != cond:
                      previous = cond
                      cond = re.sub(r"\([^()]*\)", "", cond)
                  if "(" in cond or ")" in cond or "||" in cond:
                      return None
                  return m

          TERNARY = _Ternary

          # GitHub expression delimiters, built piecewise so that this run script never holds a
          # literal opener (GitHub evaluates openers inside run scripts, even in comments).
          OPEN = "$" + "{" + "{"
          CLOSE = "}" + "}"

          def expressions_in(text):
              """Return (expressions, ok). Each expression is the full opener..closer text.

              The closer is only recognised outside single-quoted strings ('' is an escaped quote), so
              braces inside strings or nested in the expression cannot end it early. An opener with no
              closer makes ok False; callers must treat that as an offender (fail closed).
              """
              found = []
              pos = 0
              while True:
                  start = text.find(OPEN, pos)
                  if start < 0:
                      return found, True
                  i = start + len(OPEN)
                  in_string = False
                  while i < len(text):
                      ch = text[i]
                      if in_string:
                          if ch == "'":
                              if text[i + 1:i + 2] == "'":
                                  i += 1
                              else:
                                  in_string = False
                      elif ch == "'":
                          in_string = True
                      elif text.startswith(CLOSE, i):
                          break
                      i += 1
                  else:
                      return found, False
                  found.append(text[start:i + len(CLOSE)])
                  pos = i + len(CLOSE)

          # Self-hosted runner groups whose names merely look like hosted labels.
          SELF_HOSTED_GROUPS = {"windows-builders"}

          # Reusable workflows from outside the scanned repository are rejected unless allow-listed.
          # Workflows in the organisation's public .github repository are themselves guarded.
          ALLOWED_REUSABLE_WORKFLOW_PREFIXES = ("DynacomSolutions/.github/.github/workflows/",)

          def check(path, labels):
              """labels: list of (line, text) making up one runs-on selection."""
              for ln, t in labels:
                  if t.strip() in SELF_HOSTED_GROUPS:
                      continue
                  for m in HOSTED.finditer(t):
                      offenders.append((path, ln, m.group(0)))
              if any(t.strip().lower() == "self-hosted" for _, t in labels):
                  return  # self-hosted labels are valid when no hosted label is selected

          files = sorted(
              glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
              + glob.glob("action.yml") + glob.glob("action.yaml")
              + glob.glob(".github/actions/**/action.y*ml", recursive=True)
          )

          try:
              import yaml
          except ImportError:
              print("::error::PyYAML is required to inspect workflow YAML")
              sys.exit(1)

          def leaves(node):
              """Yield (line, text) for every scalar below node (list items, group/labels values)."""
              if isinstance(node, yaml.ScalarNode):
                  yield node.start_mark.line + 1, node.value
              elif isinstance(node, yaml.SequenceNode):
                  for n in node.value:
                      yield from leaves(n)
              elif isinstance(node, yaml.MappingNode):
                  for k, v in node.value:  # group: / labels: forms
                      yield from leaves(v)

          def direct_value(node, key):
              if isinstance(node, yaml.MappingNode):
                  for k, value in node.value:
                      if isinstance(k, yaml.ScalarNode) and k.value == key:
                          yield value

          def scan_yaml(path):
              with open(path) as f:
                  root = yaml.compose(f)
              if root is None:
                  return
              for jobs in direct_value(root, "jobs"):
                  if not isinstance(jobs, yaml.MappingNode):
                      continue
                  for _, job in jobs.value:
                      for value in direct_value(job, "runs-on"):
                          labels = list(leaves(value))
                          label_nodes = list(direct_value(value, "labels"))
                          if not label_nodes and not isinstance(value, yaml.MappingNode):
                              label_nodes = [value]
                          has_self_hosted_constraint = any(
                              text.strip().lower() == "self-hosted"
                              for label_node in label_nodes
                              for _, text in leaves(label_node)
                          )
                          # Resolve only this job's matrix. Include entries can
                          # add runner values even when the base dimension is safe.
                          expressions = []
                          for line, text in labels:
                              found, ok = expressions_in(text)
                              if not ok or (found and text.strip() != found[0]) or len(found) > 1:
                                  # unterminated, embedded in other text, or several in one value
                                  offenders.append((path, line, "unsupported runner expression"))
                              expressions.extend(found)
                          matrix_refs = []
                          for expression in expressions:
                              match = re.fullmatch(r"\$\{\{\s*matrix\.([\w-]+)\s*\}\}", expression)
                              if match:
                                  matrix_refs.append(match.group(1))
                              elif TERNARY.fullmatch(expression):
                                  pass  # both literal branches are label-checked below
                              else:
                                  offenders.append((path, labels[0][0], "unsupported runner expression"))
                          for key in matrix_refs:
                              found = False
                              unresolved = False
                              for strategy in direct_value(job, "strategy"):
                                  for matrix in direct_value(strategy, "matrix"):
                                      if not isinstance(matrix, yaml.MappingNode):
                                          unresolved = True  # whole matrix is an expression
                                          continue
                                      for matrix_value in direct_value(matrix, key):
                                          labels.extend(leaves(matrix_value))
                                          found = True
                                      for include in direct_value(matrix, "include"):
                                          if isinstance(include, yaml.SequenceNode):
                                              include_items = include.value
                                          elif isinstance(include, yaml.MappingNode):
                                              include_items = [include]
                                          else:
                                              unresolved = True  # include is an expression
                                              continue
                                          for include_item in include_items:
                                              if not isinstance(include_item, yaml.MappingNode):
                                                  unresolved = True  # expression or scalar item
                                                  continue
                                              for matrix_value in direct_value(include_item, key):
                                                  labels.extend(leaves(matrix_value))
                                                  found = True
                              if (not found or unresolved) and not has_self_hosted_constraint:
                                  offenders.append((path, labels[0][0], "unresolved matrix expression"))
                          for line, text in labels:
                              for expression in expressions_in(text)[0]:
                                  if (
                                      not re.fullmatch(r"\$\{\{\s*matrix\.[\w-]+\s*\}\}", expression)
                                      and not TERNARY.fullmatch(expression)
                                      and not has_self_hosted_constraint
                                  ):
                                      offenders.append((path, line, "unsupported runner expression"))
                          if isinstance(value, yaml.MappingNode) and not label_nodes:
                              # A group with no labels selects any runner in the group, which can be a
                              # GitHub-hosted larger-runner group. Only allow-listed groups pass.
                              groups = [t.strip() for g in direct_value(value, "group") for _, t in leaves(g)]
                              if not groups or any(g not in SELF_HOSTED_GROUPS for g in groups):
                                  offenders.append((path, labels[0][0] if labels else 1, "runner group without labels"))
                          check(path, labels)
                      for uses in direct_value(job, "uses"):
                          # A reusable workflow outside this repository has runs-on we cannot see.
                          target = uses.value.strip() if isinstance(uses, yaml.ScalarNode) else ""
                          if not target.startswith("./") and not any(
                              target.startswith(prefix) for prefix in ALLOWED_REUSABLE_WORKFLOW_PREFIXES
                          ):
                              offenders.append((path, uses.start_mark.line + 1, "external reusable workflow " + target))

          for path in files:
              try:
                  scan_yaml(path)
              except Exception as e:  # unparsable file: never pass silently
                  print(f"::error file={path}::parse failed ({e})")
                  sys.exit(1)

          print(f"Scanned {len(files)} file(s)")
          if offenders:
              for path, line, label in sorted(set(offenders)):
                  print(f"::error file={path},line={line}::GitHub-hosted runner '{label}'")
                  print(f"{path}:{line}: GitHub-hosted runner '{label}'")
              print("\nUse a self-hosted runner label instead.")
              sys.exit(1)
          print("OK: no GitHub-hosted runners referenced")
          PY

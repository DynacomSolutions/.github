name: buildx-cluster
description: >-
  Set up docker buildx against the cluster's node-local BuildKit daemon (remote
  driver) and compute registry cache references. Falls back to a local
  docker-container builder when no daemon is reachable. Cluster endpoints come
  from runner environment variables, so nothing cluster-specific lives here.

inputs:
  cache-name:
    description: >-
      Cache scope within the repository, for example one per image or matrix
      entry. Becomes part of the registry cache reference.
    required: false
    default: default
  push-cache:
    description: >-
      Whether to export the registry cache. auto exports only on pushes to the
      default branch, true always, false never.
    required: false
    default: auto
  endpoint:
    description: BuildKit endpoint. Defaults to the CI_BUILDKIT_ADDR runner environment variable.
    required: false
    default: ""
  registry:
    description: Cache registry host:port. Defaults to the CI_REGISTRY_CACHE runner environment variable.
    required: false
    default: ""

outputs:
  driver:
    description: remote when the cluster daemon is in use, local for the fallback builder.
    value: ${{ steps.setup.outputs.driver }}
  builder:
    description: Name of the buildx builder that was selected.
    value: ${{ steps.setup.outputs.builder }}
  cache-from:
    description: Value for the build-push-action cache-from input (newline separated).
    value: ${{ steps.setup.outputs.cache-from }}
  cache-to:
    description: Value for the build-push-action cache-to input (empty when this build should not export).
    value: ${{ steps.setup.outputs.cache-to }}

runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        IN_CACHE_NAME: ${{ inputs.cache-name }}
        IN_PUSH_CACHE: ${{ inputs.push-cache }}
        IN_ENDPOINT: ${{ inputs.endpoint }}
        IN_REGISTRY: ${{ inputs.registry }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        endpoint="${IN_ENDPOINT:-${CI_BUILDKIT_ADDR:-}}"
        registry="${IN_REGISTRY:-${CI_REGISTRY_CACHE:-}}"

        driver=local
        builder=ci-local
        if [ -n "$endpoint" ]; then
          hostport="${endpoint#tcp://}"
          host="${hostport%%:*}"
          port="${hostport##*:}"
          # A runner on a node without a daemon has no Service endpoint, so
          # the connection is dropped rather than refused: keep the probe short.
          if timeout 5 bash -c "exec 3<>/dev/tcp/${host}/${port}" 2>/dev/null; then
            if docker buildx create --name ci-cluster --driver remote --use "$endpoint" >/dev/null \
              && docker buildx inspect --bootstrap ci-cluster >/dev/null; then
              driver=remote
              builder=ci-cluster
            else
              echo "::warning::BuildKit at ${endpoint} did not bootstrap; using a local builder"
              docker buildx rm -f ci-cluster >/dev/null 2>&1 || true
            fi
          else
            echo "::notice::No BuildKit daemon reachable at ${endpoint}; using a local builder"
          fi
        fi

        if [ "$driver" = local ]; then
          cfg="$(mktemp)"
          if [ -n "$registry" ]; then
            printf '[registry."%s"]\n  http = true\n  insecure = true\n' "$registry" > "$cfg"
            docker buildx create --name ci-local --driver docker-container --buildkitd-config "$cfg" --use >/dev/null
          else
            docker buildx create --name ci-local --driver docker-container --use >/dev/null
          fi
          docker buildx inspect --bootstrap ci-local >/dev/null
        fi

        cache_from=""
        cache_to=""
        if [ -n "$registry" ]; then
          repo="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          name="$(printf '%s' "$IN_CACHE_NAME" | tr -c 'a-zA-Z0-9._-' '-')"
          ref="${HEAD_REF:-$REF_NAME}"
          slug="$(printf '%s' "$ref" | tr -c 'a-zA-Z0-9._-' '-' | cut -c1-100)"
          base="${registry}/buildcache/${repo}/${name}"
          default_slug="$(printf '%s' "${DEFAULT_BRANCH:-main}" | tr -c 'a-zA-Z0-9._-' '-')"
          cache_from="type=registry,ref=${base}:${slug}"
          if [ "$slug" != "$default_slug" ]; then
            cache_from="${cache_from}"$'\n'"type=registry,ref=${base}:${default_slug}"
          fi
          export_cache=false
          case "$IN_PUSH_CACHE" in
            true) export_cache=true ;;
            auto) if [ "$EVENT_NAME" != pull_request ] && [ "$slug" = "$default_slug" ]; then export_cache=true; fi ;;
          esac
          if [ "$export_cache" = true ]; then
            cache_to="type=registry,ref=${base}:${slug},mode=max,image-manifest=true,oci-mediatypes=true"
          fi
        fi

        {
          echo "driver=${driver}"
          echo "builder=${builder}"
          echo "cache-from<<EOF_CACHE"
          echo "$cache_from"
          echo "EOF_CACHE"
          echo "cache-to=${cache_to}"
        } >> "$GITHUB_OUTPUT"
        echo "buildx builder: ${builder} (${driver})"
